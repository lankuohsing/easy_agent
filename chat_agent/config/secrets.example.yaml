# =============================================================================
# 模型服务敏感凭证（URL / API Key）
# =============================================================================
# 使用方法：
#   cp config/secrets.example.yaml config/secrets.yaml
#   填入各 provider 的 base_url 与 api_key（如需要）
#
# 本文件对应 config.yaml 中 llm.providers 的 key。
# secrets.yaml 已被 .gitignore 忽略，切勿提交真实密钥。
# =============================================================================

providers:
  qwen:
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    api_key: "sk-your-qwen-api-key"

  # 本地 Ollama 等无需鉴权的服务：只填 base_url，可省略 api_key
  local-ollama:
    base_url: "http://localhost:11434/v1"

  deepseek:
    base_url: "https://api.deepseek.com/v1"
    api_key: "sk-your-deepseek-api-key"
