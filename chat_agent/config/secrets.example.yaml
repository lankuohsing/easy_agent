# =============================================================================
# 模型服务敏感凭证（URL / API Key）
# =============================================================================
# 使用方法：
#   cp config/secrets.example.yaml config/secrets.yaml
#   填入各 provider 的地址与 api_key（如需要）
#
# 地址字段说明：
#   - openai_compatible：填 API 前缀，如 https://.../v1
#   - http_chat_completions：填完整 endpoint，如 https://.../v1/chat/completions
#     （也支持 api_url 字段，与 base_url 等价）
# =============================================================================

providers:
  qwen-volc:
    api_url: "https://your-gateway.volceapi.com/v1/chat/completions"
    api_key: ""

  qwen:
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    api_key: "sk-your-qwen-api-key"

  local-ollama:
    base_url: "http://localhost:11434/v1"

  deepseek:
    base_url: "https://api.deepseek.com/v1"
    api_key: "sk-your-deepseek-api-key"
