# =============================================================================
# Chat Agent 主配置示例（与 config.yaml 结构相同，供参考）
# =============================================================================
# 敏感凭证请写入 secrets.yaml，参见 secrets.example.yaml
# =============================================================================

llm:
  active: qwen
  secrets_file: config/secrets.yaml

  providers:
    qwen:
      type: openai_compatible
      model: qwen-plus
      temperature: 0.7
      max_tokens: 2048
      timeout: 60
      auth_required: true

    local-ollama:
      type: openai_compatible
      model: llama3
      temperature: 0.7
      max_tokens: 2048
      timeout: 120
      auth_required: false

agent:
  system_prompt_file: prompts/system_prompt.txt
  show_system_prompt_on_start: false

runtime:
  use_mock: false
  mock_delay: 0.3
