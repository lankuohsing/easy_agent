# =============================================================================
# Chat Agent 主配置（非敏感，可提交 Git）
# =============================================================================
# 模型服务的 URL、API Key 等敏感信息请写入 secrets.yaml（见 secrets.example.yaml）
# =============================================================================

llm:
  # 当前使用的模型服务（对应 providers 中的 key）
  active: qwen-volc

  # 敏感凭证文件路径（相对 chat_agent 目录）
  secrets_file: config/secrets.yaml

  # 模型服务列表（可配置多个，通过 active 或命令行 --provider 切换）
  providers:
    qwen-volc:
      # requests 直 POST 完整 endpoint（见 secrets.yaml 中的 api_url）
      type: http_chat_completions
      model: qwen3_6_35B_A3B
      temperature: 0.0
      max_tokens: 4096
      timeout: 300
      connect_timeout: 10
      auth_required: false
      enable_thinking: true
      generate_cfg:
        top_p: 0.8
        top_k: 1
        max_input_tokens: 32768
        separate_reasoning: false


agent:
  system_prompt_file: prompts/system_prompt.txt
  show_system_prompt_on_start: false
  memory:
    enabled: true
    storage_dir: memories

runtime:
  use_mock: false
  mock_delay: 0.3
